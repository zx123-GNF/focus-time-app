<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1600" viewBox="0 0 800 1600">
  <!-- 统计背景：青绿数据 -->
  <defs>
    <linearGradient id="teal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e7fbe9"/>
      <stop offset="0.5" stop-color="#ddf5e4"/>
      <stop offset="1" stop-color="#d7f3ef"/>
    </linearGradient>
    <radialGradient id="tglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22b07d" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#22b07d" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="1600" fill="url(#teal)"/>
  <circle cx="680" cy="180" r="300" fill="url(#tglow)"/>
  <circle cx="100" cy="900" r="280" fill="url(#tglow)"/>
  <!-- 网格线（图表坐标纸） -->
  <g stroke="#22b07d" opacity="0.08" stroke-width="1.5">
    <line x1="0" y1="180" x2="800" y2="180"/><line x1="0" y1="260" x2="800" y2="260"/>
    <line x1="0" y1="340" x2="800" y2="340"/><line x1="0" y1="420" x2="800" y2="420"/>
    <line x1="100" y1="100" x2="100" y2="500"/><line x1="250" y1="100" x2="250" y2="500"/>
    <line x1="400" y1="100" x2="400" y2="500"/><line x1="550" y1="100" x2="550" y2="500"/>
    <line x1="700" y1="100" x2="700" y2="500"/>
  </g>
  <!-- 折线 + 面积 -->
  <path d="M60 380 L200 300 L340 340 L480 220 L620 260 L760 150 L760 500 L60 500 Z" fill="#22b07d" opacity="0.10"/>
  <path d="M60 380 L200 300 L340 340 L480 220 L620 260 L760 150" fill="none" stroke="#22b07d" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.30"/>
  <g fill="#22b07d" opacity="0.4">
    <circle cx="200" cy="300" r="10"/><circle cx="480" cy="220" r="10"/><circle cx="760" cy="150" r="10"/>
  </g>
  <!-- 底部柱状图剪影 -->
  <g opacity="0.18">
    <rect x="60"  y="1220" width="70" height="260" rx="16" fill="#22b07d"/>
    <rect x="160" y="1120" width="70" height="360" rx="16" fill="#1f9e9e"/>
    <rect x="260" y="1290" width="70" height="190" rx="16" fill="#22b07d"/>
    <rect x="360" y="1040" width="70" height="440" rx="16" fill="#1f9e9e"/>
    <rect x="460" y="1200" width="70" height="280" rx="16" fill="#22b07d"/>
    <rect x="560" y="1140" width="70" height="340" rx="16" fill="#1f9e9e"/>
    <rect x="660" y="1260" width="70" height="220" rx="16" fill="#22b07d"/>
  </g>
  <!-- 环形占比装饰 -->
  <g fill="none" opacity="0.3">
    <circle cx="640" cy="620" r="70" stroke="#d5efe2" stroke-width="18"/>
    <path d="M640 550 A70 70 0 1 1 573 646" stroke="#22b07d" stroke-width="18" stroke-linecap="round"/>
  </g>
  <!-- 上升箭头 -->
  <g stroke="#1f9e9e" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.25">
    <path d="M120 760 l90 0 0 90" transform="rotate(45 165 805)"/>
  </g>
  <g fill="#22b07d" opacity="0.25">
    <circle cx="160" cy="1060" r="8"/><circle cx="200" cy="1060" r="8"/><circle cx="240" cy="1060" r="8"/>
  </g>
  <!-- 底部波浪 -->
  <path d="M0 1460 Q200 1410 400 1440 T800 1420 V1600 H0 Z" fill="#b9e6d2" opacity="0.4"/>
</svg>
