<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1600" viewBox="0 0 800 1600">
  <!-- 专注背景：极简计时环（保持白色简洁基调，仅加淡淡的氛围） -->
  <defs>
    <linearGradient id="focalsky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#f6f9ff"/>
      <stop offset="1" stop-color="#eef4ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4f7cff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#4f7cff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="1600" fill="url(#focalsky)"/>
  <!-- 右上角大光晕 -->
  <circle cx="720" cy="140" r="340" fill="url(#glow)"/>
  <circle cx="80" cy="1180" r="300" fill="url(#glow)"/>
  <!-- 巨大的同心计时环（极淡） -->
  <g fill="none" stroke="#4f7cff" opacity="0.10">
    <circle cx="640" cy="1250" r="200" stroke-width="1.5"/>
    <circle cx="640" cy="1250" r="260" stroke-width="1"/>
    <circle cx="640" cy="1250" r="320" stroke-width="0.8"/>
  </g>
  <path d="M640 1050 A200 200 0 0 1 840 1250" fill="none" stroke="#4f7cff" stroke-width="6" stroke-linecap="round" opacity="0.16"/>
  <!-- 左上刻度弧 -->
  <g fill="none" stroke="#4f7cff" opacity="0.12" stroke-linecap="round">
    <path d="M60 220 A180 180 0 0 1 240 40" stroke-width="5"/>
  </g>
  <g stroke="#4f7cff" opacity="0.14" stroke-width="2" stroke-linecap="round">
    <line x1="60" y1="150" x2="78" y2="150"/>
    <line x1="60" y1="200" x2="72" y2="200"/>
    <line x1="66" y1="250" x2="78" y2="250"/>
    <line x1="80" y1="298" x2="92" y2="292"/>
  </g>
  <!-- 淡格子点阵 -->
  <g fill="#4f7cff" opacity="0.08">
    <circle cx="120" cy="640" r="3"/><circle cx="160" cy="640" r="3"/><circle cx="200" cy="640" r="3"/>
    <circle cx="120" cy="680" r="3"/><circle cx="160" cy="680" r="3"/><circle cx="200" cy="680" r="3"/>
    <circle cx="120" cy="720" r="3"/><circle cx="160" cy="720" r="3"/><circle cx="200" cy="720" r="3"/>
    <circle cx="560" cy="760" r="3"/><circle cx="600" cy="760" r="3"/><circle cx="640" cy="760" r="3"/>
    <circle cx="560" cy="800" r="3"/><circle cx="600" cy="800" r="3"/><circle cx="640" cy="800" r="3"/>
  </g>
  <!-- 底部淡淡的波浪 -->
  <path d="M0 1500 Q200 1450 400 1480 T800 1460 V1600 H0 Z" fill="#dfe9ff" opacity="0.5"/>
</svg>
