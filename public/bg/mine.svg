<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1600" viewBox="0 0 800 1600">
  <!-- 我的背景：粉橘晚霞 -->
  <defs>
    <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe3ec"/>
      <stop offset="0.5" stop-color="#ffd9d2"/>
      <stop offset="1" stop-color="#fff0e0"/>
    </linearGradient>
    <radialGradient id="dg" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fd6585" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#fd6585" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="horizon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.7"/>
    </linearGradient>
  </defs>
  <rect width="800" height="1600" fill="url(#dusk)"/>
  <circle cx="180" cy="260" r="300" fill="url(#dg)"/>
  <circle cx="660" cy="1100" r="320" fill="url(#dg)"/>
  <!-- 夕阳 -->
  <circle cx="620" cy="330" r="150" fill="url(#dg)"/>
  <circle cx="620" cy="330" r="64" fill="#ff9d76" opacity="0.6"/>
  <circle cx="620" cy="330" r="46" fill="#ffb28c" opacity="0.75"/>
  <!-- 柔和大色块 -->
  <g opacity="0.22">
    <ellipse cx="200" cy="480" rx="180" ry="60" fill="#ff8fb1"/>
    <ellipse cx="600" cy="620" rx="200" ry="66" fill="#ffa98c"/>
    <ellipse cx="150" cy="820" rx="190" ry="62" fill="#ffb3c9"/>
  </g>
  <!-- 头像圈装饰 -->
  <g opacity="0.3">
    <circle cx="150" cy="1120" r="56" fill="none" stroke="#fd6585" stroke-width="5" stroke-dasharray="4 14" stroke-linecap="round"/>
    <circle cx="150" cy="1120" r="34" fill="#ffd3dd"/>
  </g>
  <g opacity="0.22">
    <circle cx="640" cy="880" r="40" fill="none" stroke="#ff9d76" stroke-width="5" stroke-dasharray="4 12" stroke-linecap="round"/>
  </g>
  <!-- 星星 -->
  <g fill="#fd6585" opacity="0.4">
    <path d="M420 200 l6 16 16 6 -16 6 -6 16 -6 -16 -16 -6 16 -6 Z"/>
    <path d="M700 520 l5 13 13 5 -13 5 -5 13 -5 -13 -13 -5 13 -5 Z"/>
    <path d="M90 640 l5 13 13 5 -13 5 -5 13 -5 -13 -13 -5 13 -5 Z"/>
    <path d="M520 1330 l5 13 13 5 -13 5 -5 13 -5 -13 -13 -5 13 -5 Z"/>
  </g>
  <!-- 光点 -->
  <g fill="#ffffff" opacity="0.8">
    <circle cx="300" cy="160" r="5"/><circle cx="540" cy="120" r="4"/>
    <circle cx="120" cy="380" r="4"/><circle cx="720" cy="740" r="5"/>
    <circle cx="360" cy="1180" r="4"/><circle cx="240" cy="1300" r="5"/>
  </g>
  <!-- 底部柔光与波浪 -->
  <rect y="1000" width="800" height="600" fill="url(#horizon)"/>
  <path d="M0 1440 Q200 1385 400 1420 T800 1400 V1600 H0 Z" fill="#ffb3c9" opacity="0.35"/>
  <path d="M0 1510 Q220 1465 430 1495 T800 1478 V1600 H0 Z" fill="#ff9d9d" opacity="0.3"/>
</svg>
