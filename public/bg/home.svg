<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1600" viewBox="0 0 800 1600">
  <!-- 首页背景：暖阳晨曦 -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9d2"/>
      <stop offset="0.45" stop-color="#ffd8b5"/>
      <stop offset="1" stop-color="#ffeede"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffcf6e" stop-opacity="0.95"/>
      <stop offset="0.6" stop-color="#ffcf6e" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffcf6e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.75"/>
    </linearGradient>
  </defs>
  <rect width="800" height="1600" fill="url(#sky)"/>
  <!-- 太阳 -->
  <circle cx="620" cy="230" r="260" fill="url(#sun)"/>
  <circle cx="620" cy="230" r="88" fill="#ffbf5e" opacity="0.85"/>
  <circle cx="620" cy="230" r="66" fill="#ffd98c" opacity="0.9"/>
  <!-- 云朵 -->
  <g fill="#ffffff" opacity="0.55">
    <ellipse cx="180" cy="300" rx="130" ry="42"/>
    <ellipse cx="270" cy="275" rx="90" ry="36"/>
    <ellipse cx="520" cy="470" rx="150" ry="44"/>
    <ellipse cx="620" cy="445" rx="95" ry="34"/>
  </g>
  <g fill="#ffffff" opacity="0.38">
    <ellipse cx="120" cy="560" rx="170" ry="40"/>
    <ellipse cx="430" cy="700" rx="190" ry="46"/>
    <ellipse cx="680" cy="850" rx="160" ry="42"/>
  </g>
  <!-- 飞鸟 -->
  <g stroke="#c8825a" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.5">
    <path d="M250 180 q18 -16 36 0 q18 -16 36 0"/>
    <path d="M350 230 q14 -13 28 0 q14 -13 28 0"/>
    <path d="M180 260 q12 -11 24 0 q12 -11 24 0"/>
  </g>
  <!-- 底部柔光 -->
  <rect y="900" width="800" height="700" fill="url(#haze)"/>
  <!-- 底部波浪 -->
  <path d="M0 1330 Q200 1270 400 1310 T800 1290 V1600 H0 Z" fill="#ffd8b5" opacity="0.45"/>
  <path d="M0 1400 Q220 1345 430 1385 T800 1365 V1600 H0 Z" fill="#ffc99a" opacity="0.4"/>
  <!-- 细小光点 -->
  <g fill="#ffffff" opacity="0.7">
    <circle cx="90" cy="150" r="5"/><circle cx="410" cy="120" r="4"/>
    <circle cx="710" cy="620" r="5"/><circle cx="150" cy="760" r="4"/>
    <circle cx="530" cy="980" r="5"/><circle cx="240" cy="1080" r="4"/>
  </g>
</svg>
